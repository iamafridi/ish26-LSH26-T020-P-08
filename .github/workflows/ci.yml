name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - run: npm ci
      - run: npm run test:enterprise
      - run: npm test
      - run: npm run process
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gpa-engine:${{ github.sha }} .
      - run: docker run -d -p 3000:3000 -e INPUT_PATH=/app/P08_school_results_public.json gpa-engine:${{ github.sha }} && sleep 3 && curl -f http://localhost:3000/health && curl -f http://localhost:3000/api/cases | head -c 500
  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run build
