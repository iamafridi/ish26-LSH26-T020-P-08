name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: problem_08/package.json }
      - run: npm ci
        working-directory: problem_08
      - run: npm run test:enterprise
        working-directory: problem_08
      - run: npm test
        working-directory: problem_08
      - run: node src/adapters/cli.js "P08_school_results_public.json" --output ./output
        working-directory: problem_08
        # fallback to D:/ path in CI use relative
      - run: node src/adapters/cli.js "../P08_school_results_public.json" --output ./output || true
        working-directory: problem_08
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gpa-engine:${{ github.sha }} problem_08
      - run: docker run -d -p 3000:3000 -e INPUT_PATH=/app/P08_school_results_public.json gpa-engine:${{ github.sha }} && sleep 3 && curl -f http://localhost:3000/health && curl -f http://localhost:3000/api/cases | head -c 500
  lighthouse:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: problem_08
      - run: npx serve apps/web -l 3000 &
        working-directory: problem_08
      - uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://localhost:3000
          budgetPath: ./problem_08/.lighthouserc.json
