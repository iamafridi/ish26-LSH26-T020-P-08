version: "3.9"
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INPUT_PATH=/app/P08_school_results_public.json
    volumes:
      - ./P08_school_results_public.json:/app/P08_school_results_public.json:ro
      - ./output:/app/output
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
  # DB & cache for production evolution (currently engine is stateless; these are ready for when you add persistence)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpa_engine
      POSTGRES_USER: gpa
      POSTGRES_PASSWORD: gpa_secret_change_me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    profiles: ["with-db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["with-db"]

volumes:
  pgdata:
